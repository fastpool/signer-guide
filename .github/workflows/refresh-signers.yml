# Reads the registered signers off the chain and updates src/data/signers.json.
#
# The guide ships its data as a committed file, so it is only ever as current
# as the last run of `pnpm generate:signers`. This does that run daily.
#
# Two things it deliberately does not do:
#   - commit on the timestamp alone. Most runs find the same pools with the
#     same fees; committing those would bury the runs that matter.
#   - commit data the guide cannot stand behind. The tests run against the new
#     file first, so a refresh that breaks a claim on the page fails here
#     instead of shipping.
#
# Pushes made with GITHUB_TOKEN do not start other workflows, so if a deploy is
# ever wired up it will need its own schedule or a PAT.

name: Refresh signer data

on:
  schedule:
    # Daily, off the hour: the whole of GitHub aims at :00 and cron slips.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-signers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Keep the current data to compare against
        run: cp src/data/signers.json "$RUNNER_TEMP/previous-signers.json"

      - name: Read the registered signers from the chain
        # Hiro allows about 50 requests a minute. The script paces itself and
        # retries a 429, and skips a contract it cannot read rather than
        # failing, so a bad day upstream costs a line in the summary.
        run: pnpm generate:signers

      - name: Work out what changed
        id: changes
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: |
          pnpm exec tsx scripts/describe-signer-changes.ts \
            "$RUNNER_TEMP/previous-signers.json" src/data/signers.json

      - name: Check the guide still holds with the new data
        if: steps.changes.outputs.changed == 'true'
        # The tests assert against the real data — that a filter still matches
        # something, that the pools it names are still there. A refresh that
        # breaks one of those is exactly when a person should look.
        run: |
          pnpm test
          pnpm build

      - name: Commit the new data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/signers.json
          git commit --file "$RUNNER_TEMP/commit-message.txt"
          git push

      - name: Ask for a review of code we have not read
        if: steps.changes.outputs.unreviewed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the script:
          # these ids come from the chain, not from us.
          UNREVIEWED: ${{ steps.changes.outputs.unreviewed }}
        run: |
          for contract in $UNREVIEWED; do
            title="Review the signer contract $contract"
            existing=$(gh issue list --state open --search "$title in:title" \
              --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              echo "already asked, in #$existing: $contract"
              continue
            fi

            {
              echo "A pool has registered \`$contract\`, and its code matches none"
              echo "of the contracts in \`src/lib/profiles.ts\`. Until someone reads"
              echo "it, the guide says so on the page rather than guessing."
              echo
              echo "Read the source, then either add its group hash to"
              echo "\`src/lib/profiles.ts\` as a new entry, or — if it turns out to be"
              echo "one we already know, only reformatted — work out why the group"
              echo "hash differs."
              echo
              echo "https://explorer.hiro.so/txid/$contract?chain=mainnet"
            } > "$RUNNER_TEMP/issue-body.md"

            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
          done
