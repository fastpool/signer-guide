# Reads the chain and updates the two committed data files:
#   src/data/signers.json — the pools, what their code allows, and their fees
#   src/data/totals.json  — how much STX each one is looking after
#
# The guide ships both as committed files, so the page is only ever as current
# as the last run. That is why this runs hourly rather than daily: a pool can
# change its fee at any moment, and until this has run again the page states
# the old one as fact. An hour is also what the amounts are worth — this is
# the whole of the guide's "backend", and it costs one read for every reader
# instead of one per reader.
#
# Two things it deliberately does not do:
#   - commit on the timestamp alone. Most runs find the same pools with the
#     same fees; committing those would bury the runs that matter. The amounts
#     carry no timestamp for the same reason, so a change there is always real.
#   - commit data the guide cannot stand behind. The tests run against the new
#     files first, so a refresh that breaks a claim on the page fails here
#     instead of shipping.
#
# Pushes made with GITHUB_TOKEN do not start other workflows, so if a deploy is
# ever wired up it will need its own schedule or a PAT. Until then the site is
# only as fresh as its last deploy, however often this runs.

name: Refresh signer data

on:
  schedule:
    # Hourly, off the hour: the whole of GitHub aims at :00 and cron slips.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-signers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Keep the current data to compare against
        run: cp src/data/signers.json "$RUNNER_TEMP/previous-signers.json"

      - name: Read the registered signers from the chain
        # Anonymous, Hiro allows about 50 requests a minute, and the script
        # paces itself to suit. Set the HIRO_API_KEY secret and it paces
        # itself far less: the runs get quicker and stop competing with every
        # other anonymous caller on the runner's IP. It is optional — without
        # it the scripts simply take the slow road.
        #
        # Either way the script retries a 429 and skips a contract it cannot
        # read rather than failing, so a bad day upstream costs a line in the
        # summary.
        #
        # No clarinet here on purpose, though the identicons are defined as the
        # hash of its output. A deployed contract's source cannot change, so
        # each icon is worked out once and then carried by signers.json itself,
        # keyed on the deployed bytes — nine distinct sources in the whole
        # history of that file. Installing a 20MB formatter every hour to
        # recompute nine answers that cannot have moved is not worth the extra
        # way this job can fail. A pool running code nobody has hashed yet
        # shows on the page as new code, until someone with clarinet on their
        # PATH runs `pnpm generate:signers` — the same person who has to read
        # that contract anyway, per the issue this job opens.
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: pnpm generate:signers

      - name: Work out what changed
        id: changes
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
        run: |
          pnpm exec tsx scripts/describe-signer-changes.ts \
            "$RUNNER_TEMP/previous-signers.json" src/data/signers.json

      - name: Read what each pool is looking after
        # Reads the pools out of the file the step above just wrote, so the
        # two always agree. Allowed to fail: the amounts are the softest thing
        # on the page, the script leaves the last ones in place rather than
        # blanking them, and losing an hour of them should not stop a fee
        # change reaching the page.
        continue-on-error: true
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: pnpm generate:totals

      - name: Read each signer's cycles, and who was in them
        # The data behind the page for one pool: what its signer held each
        # cycle and who held it. Much the most expensive thing here — a member
        # list costs one chain call per staker — so the script is built around
        # not paying for it twice. A cycle that is behind us is written once
        # and never read again, and a live cycle whose total has not moved
        # keeps the member list it already has. See the header of
        # scripts/generate-signer-history.ts.
        #
        # The budget is what keeps this inside an hourly run. It caps the
        # per-staker calls and spends them on the signers checked longest ago,
        # so a run that cannot afford everything still makes progress and comes
        # back to the rest next time. Raise it once HIRO_API_KEY is set: the
        # pacing drops from 300ms a call to 50ms and the same hour buys six
        # times as much.
        #
        # Allowed to fail, like the amounts above. History is the softest thing
        # on the site — losing an hour of it should not stop a fee change
        # reaching the page.
        continue-on-error: true
        env:
          HIRO_API_KEY: ${{ secrets.HIRO_API_KEY }}
        run: pnpm generate:history --budget 2000

      - name: Decide whether there is anything worth committing
        id: commit
        env:
          COMMIT_MESSAGE_FILE: ${{ runner.temp }}/commit-message.txt
          # Through the environment rather than interpolated into the script,
          # as with the contract ids below.
          SIGNERS_CHANGED: ${{ steps.changes.outputs.changed }}
        run: |
          if git diff --quiet -- src/data/totals.json; then
            amounts=false
          else
            amounts=true
          fi

          # Every run rewrites `generatedAt` in each signer's summary, so those
          # files are always dirty and asking `git diff` about them would
          # commit on the timestamp alone — the thing the rest of this job
          # exists to avoid. News is a cycle, an amount or a member list that
          # moved, so the timestamps are held out of the comparison.
          #
          # Staged first because `git diff` says nothing about a file it has
          # never seen, and a signer read for the first time is all new files
          # — exactly the news worth committing.
          git add -A src/data/signers/
          if git diff --cached --unified=0 -- src/data/signers/ \
              | grep -E '^[-+][^-+]' \
              | grep -qvE '^[-+][[:space:]]*"generatedAt"'; then
            history=true
          else
            history=false
          fi

          if [ "$SIGNERS_CHANGED" != 'true' ] && [ "$amounts" != 'true' ] \
              && [ "$history" != 'true' ]; then
            echo 'Same pools, same fees, same amounts, same members — nothing to commit.'
            # Only timestamps moved. Put them back so the tree is clean. No
            # untracked file can be in here: a new one would have added a line
            # that is not a timestamp, and `history` would be true.
            git reset -q -- src/data/signers/
            git checkout -- src/data/signers.json src/data/signers/
            echo 'commit=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The amounts or the history moved but the pools did not, so there is
          # no description of the change to commit under.
          if [ "$history" = 'true' ]; then
            amounts=true
          fi

          # The amounts moved but nothing else did, so there is no description
          # of the change to commit under — write a plain one.
          if [ "$SIGNERS_CHANGED" != 'true' ]; then
            {
              echo 'Refresh the amounts staked'
              echo
              echo 'Read from pox-5 by the scheduled refresh.'
            } > "$COMMIT_MESSAGE_FILE"
          fi
          echo 'commit=true' >> "$GITHUB_OUTPUT"

      - name: Check the guide still holds with the new data
        if: steps.commit.outputs.commit == 'true'
        # The tests assert against the real data — that a filter still matches
        # something, that the pools it names are still there, that every pool
        # has an amount beside it. A refresh that breaks one of those is
        # exactly when a person should look.
        run: |
          pnpm test
          pnpm build

      - name: Commit the new data
        if: steps.commit.outputs.commit == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `-A` for the history: it grows new files — a signer read for the
          # first time, a cycle nobody had walked — and `git add` on the
          # directory alone would leave a deleted member list staged as
          # present. The step above has already staged it; this is the case
          # where only the pools or the amounts moved.
          git add src/data/signers.json src/data/totals.json
          git add -A src/data/signers/
          git commit --file "$RUNNER_TEMP/commit-message.txt"
          git push

      - name: Ask for a review of code we have not read
        if: steps.changes.outputs.unreviewed != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment rather than interpolated into the script:
          # these ids come from the chain, not from us.
          UNREVIEWED: ${{ steps.changes.outputs.unreviewed }}
        run: |
          for contract in $UNREVIEWED; do
            title="Review the signer contract $contract"
            existing=$(gh issue list --state open --search "$title in:title" \
              --json number --jq '.[0].number')
            if [ -n "$existing" ]; then
              echo "already asked, in #$existing: $contract"
              continue
            fi

            {
              echo "A pool has registered \`$contract\`, and its code matches none"
              echo "of the contracts in \`src/lib/profiles.ts\`. Until someone reads"
              echo "it, the guide says so on the page rather than guessing."
              echo
              echo "Read the source, then either add its group hash to"
              echo "\`src/lib/profiles.ts\` as a new entry, or — if it turns out to be"
              echo "one we already know, only reformatted — work out why the group"
              echo "hash differs."
              echo
              echo "Run \`pnpm generate:signers\` with \`clarinet\` on your PATH while"
              echo "you are there. The scheduled refresh has none, so this contract"
              echo "has no identicon yet and the page is showing it as new code."
              echo
              echo "https://explorer.hiro.so/txid/$contract?chain=mainnet"
            } > "$RUNNER_TEMP/issue-body.md"

            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue-body.md"
          done
