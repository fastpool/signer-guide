  <title>Bitcoin Staking</title>
  <!--
    Full-bleed so it works as a maskable icon: the launcher may crop this to a
    circle, a squircle or a rounded square, and whatever it takes has to be
    Fast Pool purple rather than a transparent corner.

    The glyph already sits inside the middle half of the canvas, which is well
    within the 80% safe zone a maskable crop guarantees, so one file serves as
    both `any` and `maskable` rather than shipping two that differ only in
    padding.
  -->
