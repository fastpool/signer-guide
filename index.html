<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Installed as "Bitcoin Staking"; see public/manifest.webmanifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Staking" />
    <!-- The status bar takes the page's own colour rather than a black bar. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Signer Guide — who can you stake your STX with?</title>
    <meta
      name="description"
      content="A plain-language guide to the Stacks signer pools you can stake your STX with."
    />
    <link rel="canonical" href="https://signer-guide.fastpool.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://signer-guide.fastpool.org/" />
    <meta
      property="og:title"
      content="Signer Guide — who can you stake your STX with?"
    />
    <meta
      property="og:description"
      content="A plain-language guide to the Stacks signer pools you can stake your STX with. Fees, ceilings and who may join, read from each contract's own code."
    />
    <meta property="og:site_name" content="Fast Pool" />
    <!-- Regenerated by scripts/make-share-card.mjs, which draws only figures
         that do not move weekly: a card is cached hard by every crawler that
         fetches it, so a rate on it is a rate nobody can correct.

         The URL's ?v= and the alt text below are both written by that same
         script — edit them there, not here, or they drift from the card. The
         v is a hash of the PNG's own bytes: crawlers cache an og:image
         against the URL string they were given and never look at its date, so
         without it a redrawn card changes nothing anybody sees. -->
    <meta
      property="og:image"
      content="https://signer-guide.fastpool.org/share-card.png?v=738985ab"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Signer Guide - lock STX, earn bitcoin. 54 pools on pox-5, 9 signer contracts."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The bar around the page follows the page: cream by day, the dark
         ground by night, rather than one colour that is wrong half the time. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#fdf8f3"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#17141f"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
