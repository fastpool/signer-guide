AntiFeatures:
  NonFreeNet:
    en-US: Reads the chain through a public Stacks node and reaches wallets over a
      WalletConnect relay. Neither is free software, both are replaceable, and the
      app collects nothing itself.
Categories:
  - Wallet
License: MIT
AuthorName: Fast Pool
AuthorWebSite: https://fastpool.org
WebSite: https://signer-guide.fastpool.org
SourceCode: https://github.com/fastpool/signer-guide
IssueTracker: https://github.com/fastpool/signer-guide/issues
Changelog: https://github.com/fastpool/signer-guide/releases

RepoType: git
Repo: https://github.com/fastpool/signer-guide.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: mobile-v0.1.0
    timeout: 14400
    subdir: mobile/android
    sudo:
      - apt-get update
      - apt-get install -y npm
      - npm install -g n
      - n 22.11.0
    gradle:
      - yes
    prebuild: cd .. && npm ci
    scanignore:
      - mobile/node_modules
    gradleprops:
      - reactNativeArchitectures=armeabi-v7a,arm64-v8a

AutoUpdateMode: Version mobile-v%v
UpdateCheckMode: Tags ^mobile-v[0-9.]+$
CurrentVersion: 0.1.0
CurrentVersionCode: 1
