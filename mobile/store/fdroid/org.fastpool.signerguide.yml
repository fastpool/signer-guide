# The file that goes into fdroiddata as metadata/org.fastpool.signerguide.yml.
#
# F-Droid takes no listing from the merge request: it reads
# `fastlane/metadata/android/<locale>/` out of this repository at the tagged
# commit, which is why that tree is generated and committed here. What is below
# is only how to fetch and build.
#
# Not yet verified with `fdroid build` — see README.md beside this file for the
# two things that have to be true before it can be.

Categories:
  - Money
License: MIT
AuthorName: Fast Pool
AuthorWebSite: https://fastpool.org
WebSite: https://signer-guide.fastpool.org
SourceCode: https://github.com/fastpool/signer-guide
IssueTracker: https://github.com/fastpool/signer-guide/issues

# Declared rather than discovered.
#
# The app talks to three hosts it does not control, and two of them are run as
# services rather than published as software: a Stacks node (Hiro's by default,
# and any node can be substituted with EXPO_PUBLIC_STACKS_API_URL) and a
# WalletConnect relay (Reown's). F-Droid's reviewers would find both; saying so
# here is faster and more honest than being told.
#
# It is *not* Tracking: there is no analytics, no advertising identifier and no
# crash reporter — see store/privacy-policy.md and store/data-safety.md.
AntiFeatures:
  NonFreeNet:
    en-US: >-
      Reads the chain through a public Stacks node and reaches wallets over a
      WalletConnect relay. Neither is free software, both are replaceable, and
      the app collects nothing itself.

RepoType: git
Repo: https://github.com/fastpool/signer-guide.git

Builds:
  - versionName: 0.1.0
    versionCode: 1
    commit: mobile-v0.1.0
    subdir: mobile/android/app
    sudo:
      - apt-get update
      - apt-get install -y npm
      - npm install -g n
      - n 22
    init:
      - rm -f $$SDK$$/licenses/*
    prebuild:
      # `mobile/android` is generated by `expo prebuild` and is not in the
      # repository — keeping it out is what stops the manifest, the icons and
      # the signing config having two sources. So the build generates it.
      - cd .. && npm ci && npx expo prebuild --platform android --no-install
    gradle:
      - yes
    # arm64 only, which is what the release build ships. F-Droid will publish
    # the single ABI.
    gradleprops:
      - reactNativeArchitectures=arm64-v8a

AutoUpdateMode: Version
UpdateCheckMode: Tags ^mobile-v[0-9.]+$
UpdateCheckName: Ignore
CurrentVersion: 0.1.0
CurrentVersionCode: 1
