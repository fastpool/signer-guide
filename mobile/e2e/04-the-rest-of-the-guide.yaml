# Everything the guide knows that is not your stake: reachable in one tap, and
# nowhere near the top of the first screen.
#
# The claim being held to is the ordering: the rate first, the stake second,
# everything else under a heading below them. A tab bar would have put "every
# pool" at equal weight with "your stake", and they are not of equal weight.
#
# This used to assert that the section was *off screen*, which was true until
# the wallets moved to a screen of their own and the home screen got shorter.
# That was an assertion about this device's height rather than about the app,
# so it is gone: what is left is that the rate is the first thing, and that
# reaching anything else means scrolling past the stake to get to it.
appId: org.fastpool.signerguide
name: The rest of the guide is one tap away, and no closer
---
- launchApp:
    clearState: true
# A development build fetches its bundle from Metro on every cold start, so the
# first screen is worth waiting for rather than asserting on the instant the
# process appears. Cleared state means a first launch, so that screen is the
# welcome — which is itself worth asserting, since it is shown exactly once.
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- tapOn:
    id: 'welcome-skip'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000

- assertVisible:
    id: 'rate-card'

# Every pool, with what each holds.
- scrollUntilVisible:
    element:
      id: 'more-pools'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-pools'
- extendedWaitUntil:
    visible:
      id: 'pools-screen'
    timeout: 20000
- assertVisible: 'Every pool'
# The one place typing is exercised on the device: short enough to be quick,
# and the filter is the only free-text field that changes what is on screen.
- tapOn:
    id: 'pools-search'
- inputText: 'fastpool'
- hideKeyboard
- assertVisible:
    id: 'pools-screen'
- back

# Who is behind the signer keys. One tap from the same section, and the group
# it opens has to name what it holds — a claim about who controls a third of
# the signer set is the one screen here whose number the chain cannot check.
- scrollUntilVisible:
    element:
      id: 'more-groups'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-groups'
- extendedWaitUntil:
    visible:
      id: 'groups-screen'
    timeout: 20000
- assertVisible: 'Who holds the vote'
- assertVisible:
    id: 'groups-ungrouped'
- tapOn:
    id: 'groups-row-same-funder'
- extendedWaitUntil:
    visible:
      id: 'group-screen'
    timeout: 20000
- assertVisible:
    id: 'group-share'
- back
- back

# What each payout actually paid — reached from the rate card's own footer
# link, which is the only route to it now.
- scrollUntilVisible:
    element:
      id: 'rate-history-link'
    direction: UP
    centerElement: true
- tapOn:
    id: 'rate-history-link'
- extendedWaitUntil:
    visible:
      id: 'history-screen'
    timeout: 20000
- assertVisible:
    id: 'history-current'
- back

# Where the numbers come from, and what the app talks to.
- scrollUntilVisible:
    element:
      id: 'more-data'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-data'
- extendedWaitUntil:
    visible:
      id: 'data-status-screen'
    timeout: 20000
- assertVisible:
    id: 'data-origin'
- assertVisible: 'Where these numbers come from'
- back

# The contracts, read rather than chosen.
- scrollUntilVisible:
    element:
      id: 'more-contracts'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-contracts'
- extendedWaitUntil:
    visible:
      id: 'choose-contract-screen'
    timeout: 20000
- assertVisible:
    id: 'template-standard'
