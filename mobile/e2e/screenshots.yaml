# Store screenshots, taken from the app actually running.
#
# Not a test — it asserts almost nothing — but it lives here because it is the
# same machinery, and because a screenshot that cannot be regenerated by
# running a command is a screenshot that will be out of date by the second
# release.
#
# Everything on screen is real: the rate is whatever the branch published this
# hour, and the position is a live mainnet staker with 15,000,000 STX. No
# wallet is connected, so nothing here is a picture of somebody's money but
# their own public position.
#
#   maestro test e2e/screenshots.yaml
#   node scripts/frame-screenshots.mjs
appId: org.fastpool.signerguide
name: Screenshots
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- takeScreenshot: store/screenshots/raw/01-welcome

- tapOn:
    id: 'welcome-start'
- extendedWaitUntil:
    visible:
      id: 'start-screen'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'start-defaults'
    direction: DOWN
    centerElement: true
- takeScreenshot: store/screenshots/raw/02-start

- back
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000

# A live position, opened by share link rather than typed.
- openLink: 'signerguide://watch/SMEVJTEWM9AE521B8E3HWQTHQR0WAPASHATZTA6Y'
- extendedWaitUntil:
    visible:
      id: 'position-card'
    timeout: 30000
- takeScreenshot: store/screenshots/raw/03-your-stake

- scrollUntilVisible:
    element:
      id: 'more-contracts'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-contracts'
- extendedWaitUntil:
    visible:
      id: 'choose-contract-screen'
    timeout: 20000
- takeScreenshot: store/screenshots/raw/04-contracts
- back

- scrollUntilVisible:
    element:
      id: 'more-pools'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-pools'
- extendedWaitUntil:
    visible:
      id: 'pools-screen'
    timeout: 20000
- takeScreenshot: store/screenshots/raw/05-pools
- back

- scrollUntilVisible:
    element:
      id: 'more-history'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-history'
- extendedWaitUntil:
    visible:
      id: 'history-screen'
    timeout: 20000
- takeScreenshot: store/screenshots/raw/06-payouts
- back

- scrollUntilVisible:
    element:
      id: 'more-data'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'more-data'
- extendedWaitUntil:
    visible:
      id: 'data-status-screen'
    timeout: 20000
- takeScreenshot: store/screenshots/raw/07-the-data
- back

# Appearance and language, which are the reader's to set.
- scrollUntilVisible:
    element:
      id: 'open-preferences'
    direction: UP
    centerElement: true
- tapOn:
    id: 'open-preferences'
- extendedWaitUntil:
    visible:
      id: 'preferences-screen'
    timeout: 20000
- takeScreenshot: store/screenshots/raw/08-preferences
