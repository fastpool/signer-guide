# Connecting, and watching, on the one screen that answers "whose stake is
# this".
#
# It stops before approval: that happens inside Leather, Xverse or OKX, which
# no test runner can drive. What is checked here is everything up to the point
# where another application takes over, and the read-only route all the way
# through.
appId: org.fastpool.signerguide
name: One screen for connecting and for watching
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'welcome-screen'
    timeout: 90000
- tapOn:
    id: 'welcome-skip'
- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 30000

- tapOn:
    id: 'home-connect'
- extendedWaitUntil:
    visible:
      id: 'wallet-screen'
    timeout: 20000

# Watching first — it needs nothing installed and works for every address.
- assertVisible:
    id: 'wallet-watch'
# Then the wallet browsers, which do work.
- scrollUntilVisible:
    element:
      id: 'wallet-browser'
    direction: DOWN
    centerElement: true
- assertVisible:
    id: 'browser-leather'
- assertVisible:
    id: 'browser-xverse'

# WalletConnect last, offering the link and no wallet it cannot reach that way.
- scrollUntilVisible:
    element:
      id: 'wallet-connect'
    direction: DOWN
    centerElement: true
- assertVisible:
    id: 'connect-any'
- assertNotVisible:
    id: 'connect-leather'

# An address that is not one goes nowhere.
#
# Asserted as behaviour rather than as a disabled attribute: React Native's
# `Pressable` carries `accessibilityState.disabled`, which Android does not
# always surface as the node's `enabled` flag — so the attribute assertion
# passed or failed on a detail of the platform rather than on the app. Pressing
# it and staying put is the thing that actually matters.
- scrollUntilVisible:
    element:
      id: 'watch-input'
    direction: UP
    centerElement: true
- tapOn:
    id: 'watch-input'
- inputText: 'nonsense'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'watch-submit'
    direction: UP
    centerElement: true
- tapOn:
    id: 'watch-submit'
- assertVisible:
    id: 'wallet-screen'
- assertVisible:
    id: 'watch-input'
